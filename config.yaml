# image-triage configuration
# Precedence: CLI options > IMAGE_TRIAGE_* environment variables > this file > defaults.
app:
  log_level: INFO
  max_workers: null
  strict: false
input:
  root: .
  db_path: null
  exclude:
  - .image-triage
  - selected
  - previews
  follow_symlinks: false
analysis:
  preview_size: 1024
  draft: true
  batch_size: 4
  yolo_enabled: true
  yolo_confidence: 0.5
  aesthetic_enabled: true
  save_embeddings: true
scoring:
  sharpness_weight: 0.45
  composition_weight: 0.25
  aesthetic_weight: 0.15
  subject_weight: 0.15
  blur_threshold: 0.15
  min_score_5: 0.75
  min_score_4: 0.45
  sharpness_percentile: 90.0
  subject_classes:
  - person
  - bird
  - cat
  - dog
  - horse
  - sheep
  - cow
  - elephant
  - bear
  - zebra
  - giraffe
  - car
  - bicycle
  - motorcycle
  - airplane
  - boat
similarity:
  max_hash_distance: 12
  max_time_gap_s: 10.0
  min_embedding_similarity: 0.97
  event_gap_s: 14400.0
  gps_jump_km: 50.0
selection:
  top_n: 200
  diversity: 0.5
  max_per_group: 1
  max_per_day: 5
  max_per_cluster: 3
  event_quota: sainte_lague
  profiles_dir: profiles
  profile: best200
models:
  enabled: true
  yolo_path: res/yolo/yolo26n.onnx
  aesthetic_path: res/aesthetic/aesthetic.onnx
  registry_path: res/models/registry.json
  provider: CPUExecutionProvider
  auto_download: false
report:
  include_gps: false
  previews: true
  preview_max_side: 1600
  webp_quality: 80
  csv_columns: null
  export_mode: copy
gui:
  host: 127.0.0.1
  port: 8765
  reload: false
