[project]
name = "image-triage"
dynamic = ["version"]
description = "Analyze photos, group similar shots, rate them and export the best ones"
authors = [
    {name = "pamagister"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.10",
    "fastapi>=0.115.0",
    "imagehash>=4.3.2",
    "jinja2>=3.1.0",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32.0",
]
gpu = [
    "onnxruntime-gpu>=1.20.0",
]

[project.scripts]
image-triage = "image_triage.cli.app:main"
image-triage-download-model = "image_triage.models.registry:main"

[project.gui-scripts]
image-triage-gui = "image_triage.gui.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "pyinstaller>=6.16.0",
    "pre-commit>=4.2.0",
    "pytest-mock>=3.14.1",
    "coverage>=7.8.2",
    "flake8>=7.2.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.16.0",
    "gitchangelog>=3.0.4",
    "pre-commit>=4.2.0",
    "requests>=2.34.2",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=2.6.1",
    "pygments>=2.19.1",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["lxml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/image_triage/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E721", "UP015", "B009", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
