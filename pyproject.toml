[project]
name = "image-triage"
dynamic = ["version"]
description = "Analyze photos, group similar shots, rate them and export the best ones"
authors = [
    {name = "pamagister"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.10",
    "config-cli-gui>=0.3.9",
    "imagehash>=4.3.2",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "ttkbootstrap>=1.10.1",
]

[project.scripts]
image-triage = "image_triage.cli:main"
image-triage-download-model = "image_triage.models:main"

[project.gui-scripts]
image-triage-gui = "image_triage.gui:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "pyinstaller>=6.16.0",
]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/image_triage/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E721", "UP015", "B009", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
