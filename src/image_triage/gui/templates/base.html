<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Image Triage{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/ui.js" defer></script>
  <script src="/static/selection.js" defer></script>
  <script src="/static/jobs.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="/">Library</a>
      <a href="/groups">Similar shots</a>
      <a href="/events">Events</a>
      <a href="/settings">Settings</a>
    </nav>
    <a class="header-jobs" href="/jobs" data-header-jobs>
      Jobs <span class="job-indicator" data-header-job-count hidden></span>
    </a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
